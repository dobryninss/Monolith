# Exodus nebula content biomes. The standard worldgen pipeline determines timing and density;
# each profile only selects the content table used inside matching nebulas.
# Every spawn entry in a profile belongs to one weighted group, so each accepted worldgen
# candidate becomes exactly one asteroid.

# =============================================================================
# Blue nebula
# =============================================================================
# Near ring: 0 - 40,000 from the map center.
- type: nebulaContentSpawnProfile
  id: NebulaBlueContentNear
  markers: [ NebulaBlueMarker ]
  distanceRange: 0, 40000
  spawns:
  - id: ExodusAsteroidCryoBluespaceDebrisSmall
    prob: 10
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisMedium
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisLarge
    prob: 20
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraLarge
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisHuge
    prob: 10
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraHuge
    prob: 10
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisEnormous
    prob: 5
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisMassive
    prob: 15
    orGroup: debris

# Middle ring: 40,000 - 55,000 from the map center.
- type: nebulaContentSpawnProfile
  id: NebulaBlueContentMiddle
  markers: [ NebulaBlueMarker ]
  distanceRange: 40000, 55000
  spawns:
  - id: ExodusAsteroidCryoBluespaceDebrisMedium
    prob: 5
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisLarge
    prob: 10
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraLarge
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisHuge
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraHuge
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisEnormous
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisMassive
    prob: 25
    orGroup: debris

# Far ring: 55,000 - 75,000 from the map center.
- type: nebulaContentSpawnProfile
  id: NebulaBlueContentFar
  markers: [ NebulaBlueMarker ]
  distanceRange: 55000, 75000
  spawns:
  - id: ExodusAsteroidCryoBluespaceDebrisLarge
    prob: 5
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraLarge
    prob: 5
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisHuge
    prob: 10
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisExtraHuge
    prob: 15
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisEnormous
    prob: 25
    orGroup: debris
  - id: ExodusAsteroidCryoBluespaceDebrisMassive
    prob: 40
    orGroup: debris

# =============================================================================
# Red nebula
# =============================================================================
# Red nebulas intentionally have no content profile. The nebula debris exclusion system blocks
# ordinary space debris when no matching profile exists, so no asteroids generate inside them.

