# TODO Exodus: These stationary prototypes are for reviewing the small jellyfish sprites.
# Replace their zero movement speeds with nebula wandering, grid avoidance and fleeing
# when fauna behaviour is implemented. Keep them out of world spawning until then.
- type: entity
  id: BaseSpaceSmallJellyfishTest
  parent: [ BaseMob, MobDamageable, FlyingMobBase ]
  abstract: true
  name: small nebula jellyfish
  description: A tiny translucent creature with branching lights beneath its mantle.
  suffix: Sprite test
  components:
  # BaseMob deliberately provides no HTN: these test mobs must not wander off.
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Sprite
    sprite: _Exodus/Mobs/Space/small_jellyfish_motion.rsi
    noRot: true
    layers:
    - state: red
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: red_glow
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: red
        BaseUnshaded: red_glow
      Dead:
        Base: red_dead

