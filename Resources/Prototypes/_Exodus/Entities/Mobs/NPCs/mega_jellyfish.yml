- type: entity
  id: SpaceMegaJellyfish
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat, ShowMedicalIcons ]
  name: space mega jellyfish
  description: A colossal bioluminescent creature drifting through the void.
  suffix: admin spawn
  components:
  - type: Damageable
    damageModifierSet: Medusa
    damageContainer: Biological
  - type: Insulated
    coefficient: 0
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      groups:
        Brute: -25
        Burn: -25
        Toxin: -25
      types:
        Bloodloss: -3
  - type: RadialDamageFieldTarget
    profiles:
    - Medusa
  - type: PointLight
    color: "#55DDFFFF"
    radius: 10
    energy: 4
  - type: MovementSpeedModifier
    baseSprintSpeed: 12
    baseWalkSpeed: 12
  - type: NoRotateOnMove
  - type: SmoothRotationOnMove
    rotationSpeed: 120
    disableInCombatMode: true
  - type: RadarBlip
    scale: 8
    shape: hexagon
    visibleFromOtherGrids: true
  - type: ShipNpcTarget
    needGrid: NoGrid
    priority: 1
  - type: BluespaceMapBlip
    shape: Ring
    color: "#55DDFF"
    scale: 1.5
    label: bluespace-map-blip-space-mega-jellyfish
  - type: NpcFactionMember
    factions:
    - Medusa
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.ReadOnlyBluespaceMapUiKey.Key:
        type: ReadOnlyBluespaceMapBoundUserInterface
      enum.FireControlConsoleUiKey.Key:
        type: FireControlConsoleBoundUserInterface
        requireInputValidation: false
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.ReadOnlyBluespaceMapUiKey.Key:
        toggleAction: ActionShowBluespaceMap
      enum.FireControlConsoleUiKey.Key:
        toggleAction: ActionSpaceMegaJellyfishFireControl
  - type: RadarConsole
    followEntity: true
    hideCoords: false
    maxRange: 1500
    maxIffRange: null
  - type: IntrinsicFireControl
    maxRange: 1500
    weaponName: space-mega-jellyfish-destructive-beam-name
  - type: MovementIgnoreGravity
    gravityState: true
  - type: Eye
    pvsScale: 4.458052
  - type: ContentEye
    targetZoom: 4.458052,4.458052
    maxZoom: 4.458052,4.458052
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      body:
        shape:
          !type:PhysShapeAabb
          bounds: "-3.7,-3.2,3.7,3.2"
        density: 137992
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.3
    angle: 0
    range: 5
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Blunt: 50
        Slash: 45
        Structural: 800
  - type: Gun
    fireRate: 2
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    recoil: 0
    cameraRecoilScalar: 0
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 4000000
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon2.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: HitscanBatteryAmmoProvider
    proto: SpaceMegaJellyfishSunderLaser
    fireCost: 100
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 200
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Medium
  - type: Speech
    speechVerb: LargeMob
  - type: Sprite
    sprite: _Exodus/Mobs/Space/mega_jellyfish.rsi
    noRot: false
    layers:
    - sprite: Effects/spookysmoke.rsi
      state: spookysmoke
      scale: 0.6666667,1
      offset: 2.75,3.5
      color: "#7468FFCC"
      visible: false
      map: [ gasTop ]
    - sprite: Effects/spookysmoke.rsi
      state: spookysmoke
      scale: 0.6666667,1
      offset: 0.75,4
      color: "#7468FFCC"
      visible: false
      map: [ gasUpperMiddle ]
    - sprite: Effects/spookysmoke.rsi
      state: spookysmoke
      scale: 0.6666667,1
      offset: -0.75,4
      color: "#7468FFCC"
      visible: false
      map: [ gasLowerMiddle ]
    - sprite: Effects/spookysmoke.rsi
      state: spookysmoke
      scale: 0.6666667,1
      offset: -2.75,3.5
      color: "#7468FFCC"
      visible: false
      map: [ gasBottom ]
    - state: body
    - state: glow
      shader: unshaded
  - type: SpriteMovement
    movementLayers:
      gasTop: { visible: true }
      gasUpperMiddle: { visible: true }
      gasLowerMiddle: { visible: true }
      gasBottom: { visible: true }
    noMovementLayers:
      gasTop: { visible: false }
      gasUpperMiddle: { visible: false }
      gasLowerMiddle: { visible: false }
      gasBottom: { visible: false }
  - type: OptionsVisualizer
    visuals:
      gasTop:
      - options: Default
        data: { state: spookysmoke }
      - options: ReducedMotion
        data: { state: spookysmoke_static }
      gasUpperMiddle:
      - options: Default
        data: { state: spookysmoke }
      - options: ReducedMotion
        data: { state: spookysmoke_static }
      gasLowerMiddle:
      - options: Default
        data: { state: spookysmoke }
      - options: ReducedMotion
        data: { state: spookysmoke_static }
      gasBottom:
      - options: Default
        data: { state: spookysmoke }
      - options: ReducedMotion
        data: { state: spookysmoke_static }
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: MobThresholds
    thresholds:
      0: Alive
      16000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 16000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SlowOnDamage
    speedModifierThresholds:
      8000: 0.7
      12800: 0.5
  - type: Tag
    tags:
    - SpaceMegaJellyfish
  - type: DamageContacts
    damage:
      types:
        Structural: 4000
        Blunt: 10
    ignoreWhitelist:
      tags:
      - SpaceMegaJellyfish

- type: entity
  id: ActionSpaceMegaJellyfishFireControl
  name: Jellyfish Weapons Interface
  description: Open the space mega jellyfish's long-range weapons interface.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: { sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi, state: beam_blue }
    iconOn: { sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi, state: beam_blue }
    priority: -4
    event: !type:ToggleIntrinsicUIEvent { key: enum.FireControlConsoleUiKey.Key }

- type: entity
  id: SpaceMegaJellyfishSunderLaser
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue
  - type: HitscanRadarSignature
    radarColor: "#299CFF"
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 300
        Structural: 10000
  - type: HitscanBasicRaycast
    maxDistance: 1500
