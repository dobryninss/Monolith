# TODO Exodus: These stationary prototypes are for reviewing the medium jellyfish sprites.
# Replace their zero movement speeds and temporary health, and add ranged combat and
# nebula behaviour when fauna mechanics are implemented. Idle and death artwork is ready.
# Keep these test mobs out of world spawning until then.
- type: entity
  id: BaseSpaceMediumJellyfishTest
  parent: [ BaseMob, FlyingMobBase ]
  abstract: true
  name: medium nebula jellyfish
  description: A translucent creature with folded luminous tissue and a bright core beneath its broad mantle.
  suffix: Sprite test
  components:
  # BaseMob deliberately provides no HTN: these test mobs must not wander off.
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  # Temporary health is only for testing death visuals and restoring the living state.
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
    allowRevives: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.7
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    sprite: _Exodus/Mobs/Space/medium_jellyfish_motion.rsi
    noRot: true
    layers:
    - state: red
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: red_glow
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: red
        BaseUnshaded: red_glow
      Dead:
        Base: red_dead

